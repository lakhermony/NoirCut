name: Build & Publish NoirCut Releases (Windows, AppImage, DEB, RPM)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.6)'
        required: true
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Typecheck, Audit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Ensure FFmpeg binary for tests
        run: |
          if [ ! -x node_modules/ffmpeg-static/ffmpeg ]; then
            mkdir -p node_modules/ffmpeg-static
            ln -sf "$(which ffmpeg)" node_modules/ffmpeg-static/ffmpeg
          fi

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build-linux:
    name: Linux (AppImage, DEB, RPM)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install RPM builder
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build
        run: |
          npm run typecheck
          npm run build
          npm run licenses:generate

      - name: Package AppImage, DEB, RPM
        run: npx electron-builder --linux AppImage deb rpm --x64 --publish never

      - name: Verify Linux artifacts
        run: |
          ls -lh dist/
          test -f dist/NoirCut-*.AppImage
          test -f dist/*.deb
          test -f dist/*.rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-releases
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml
          if-no-files-found: error

  build-windows:
    name: Windows (NSIS Setup & Portable x64)
    needs: [test]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stage native Windows FFmpeg & FFprobe binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin/win | Out-Null
          Copy-Item -Force node_modules/ffmpeg-static/ffmpeg.exe resources/bin/win/ffmpeg.exe
          Copy-Item -Force node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe resources/bin/win/ffprobe.exe
          Get-ChildItem resources/bin/win

      - name: Typecheck & Build
        run: |
          npm run typecheck
          npm run build
          npm run licenses:generate

      - name: Package Windows Portable & NSIS
        run: npx electron-builder --win portable nsis --x64 --publish never

      - name: Verify Windows binaries & installers
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (!(Test-Path "dist/win-unpacked/NoirCut.exe")) { throw "NoirCut.exe missing" }
          $ffOut = & "dist/win-unpacked/resources/bin/win/ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffmpeg.exe failed" }
          $ffOut | Select-Object -First 2
          $fpOut = & "dist/win-unpacked/resources/bin/win/ffprobe.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffprobe.exe failed" }
          $fpOut | Select-Object -First 2
          $asarFpOut = & "dist/win-unpacked/resources/app.asar.unpacked/node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "ASAR ffprobe.exe failed" }
          $asarFpOut | Select-Object -First 2
          $portable = Get-Item "dist/NoirCut-*-Portable.exe"
          $setup = Get-Item "dist/NoirCut-*-win-*.exe" | Where-Object { $_.Name -notlike "*-Portable*" }
          if (!$portable -or !$setup) { throw "Portable or Setup EXE missing" }
          Write-Host "Portable: $($portable.Name) ($($portable.Length) bytes)"
          Write-Host "Setup: $($setup.Name) ($($setup.Length) bytes)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-releases
          path: |
            dist/NoirCut*.exe
            dist/NoirCut*.blockmap
            dist/latest.yml
          if-no-files-found: error

  publish-release:
    name: Publish Assets to GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Flatten asset files & generate SHA256SUMS.txt
        run: |
          mkdir -p upload-files
          find release-assets -type f -exec cp -v {} upload-files/ \;
          (cd upload-files && sha256sum * > SHA256SUMS.txt)
          cat upload-files/SHA256SUMS.txt
          ls -lh upload-files/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'upload-files/*'

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "::error::Release tag input cannot be empty for workflow_dispatch"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          draft: false
          make_latest: true
          overwrite_files: true
          files: upload-files/*
