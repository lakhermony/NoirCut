name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck-and-test:
    name: Typecheck, Audit & Regression Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Ensure FFmpeg binary for tests
        run: |
          if [ ! -x node_modules/ffmpeg-static/ffmpeg ]; then
            mkdir -p node_modules/ffmpeg-static
            ln -sf "$(which ffmpeg)" node_modules/ffmpeg-static/ffmpeg
          fi

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
