[package]
name = "noircut"
version = "1.0.5"
description = "NoirCut Studio — High-Performance Rust & Tauri v2 NLE Video Editor Backend"
authors = ["NoirCut Studio <lakhermony@users.noreply.github.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
sha1 = "0.10"
base64 = "0.22"
rfd = "0.15"
urlencoding = "2.1"
chrono = "0.4"
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
